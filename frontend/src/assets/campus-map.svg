<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="890" viewBox="0 0 1270 890">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1c1813" stroke-width="0.5"/>
    </pattern>
    <filter id="bs" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#0a0908" flood-opacity="1"/>
    </filter>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400&display=swap');
      .bn { font-family: 'Press Start 2P', monospace; font-size: 7px; fill: #c8b890; opacity: 0.6; text-anchor: middle; }
      .sn { font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; fill: #5a4c3a; text-anchor: middle; }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="1270" height="890" fill="#161210"/>
  <!-- Grid -->
  <rect width="1270" height="890" fill="url(#grid)"/>

  <!-- ================================================================
       ROADS & PARKING (fill #221d17, no outline)
       ================================================================ -->

  <!-- Hervannan valtaväylä – curved left highway -->
  <path d="M 62,155 C 88,320 92,560 70,840 L 108,840 C 106,560 102,320 100,155 Z"
        fill="#221d17"/>

  <!-- Tekniikankatu – top horizontal road -->
  <rect x="308" y="197" width="544" height="32" fill="#221d17"/>

  <!-- Korkeakoulunkatu – middle road (full width) -->
  <rect x="105" y="467" width="1076" height="30" fill="#221d17"/>

  <!-- Hermiankatu – bottom road -->
  <rect x="165" y="778" width="598" height="26" fill="#221d17"/>

  <!-- Hervannantie – right vertical road -->
  <rect x="1178" y="155" width="34" height="690" fill="#221d17"/>

  <!-- Internal campus access paths -->
  <!-- Vertical path between Sähkötalo/Kampusareena zone and Konetalo zone -->
  <rect x="326" y="497" width="22" height="134" fill="#221d17"/>
  <!-- Horizontal path north of Konetalo / south of Festia–Tamppi row -->
  <rect x="326" y="607" width="404" height="24" fill="#221d17"/>
  <!-- Short east–west connector near Main building south -->
  <rect x="562" y="547" width="30" height="62" fill="#221d17"/>
  <!-- Corridor between Rakennustalo and Main building -->
  <rect x="557" y="378" width="48" height="119" fill="#221d17"/>

  <!-- Surface parking – upper left (near Tekniikankatu junction) -->
  <rect x="314" y="229" width="56" height="50" fill="#221d17"/>
  <!-- Surface parking – upper right (near Rakennustalo east edge) -->
  <rect x="668" y="230" width="68" height="40" fill="#221d17"/>
  <!-- Surface parking – right of Rakennustalo (east) -->
  <rect x="668" y="358" width="68" height="109" fill="#221d17"/>
  <!-- Large parking lot – east campus, right of Korkeakoulunkatu end -->
  <rect x="733" y="467" width="97" height="80" fill="#221d17"/>
  <!-- Parking strip west of main garage (left campus) -->
  <rect x="105" y="497" width="83" height="185" fill="#221d17"/>
  <!-- South campus parking – east of Tamppi Areena -->
  <rect x="730" y="497" width="100" height="200" fill="#221d17"/>
  <!-- South of Tamppi Areena -->
  <rect x="592" y="693" width="138" height="87" fill="#221d17"/>
  <!-- Research facilities parking right -->
  <rect x="833" y="572" width="120" height="48" fill="#221d17"/>

  <!-- ================================================================
       BUILDINGS (fill #2a241c, stroke #8a7a5a 1.5 px, shadow offset 3)
       ================================================================ -->

  <!-- Student sauna – small rect, above Tekniikankatu, right of center -->
  <rect x="598" y="163" width="48" height="40"
        fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>

  <!-- Tietotalo – irregular polygon, left campus -->
  <polygon
    points="148,403 178,379 212,372 269,376 288,390 318,383 326,400
            319,418 293,423 279,439 299,452 308,484
            268,490 252,465 231,454 212,465 197,484 173,488
            158,457 145,432"
    fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>

  <!-- Noodi – large upper building with crenellated bottom -->
  <polygon
    points="370,250 513,250 513,344 504,344 504,394 470,394 470,433 431,433 431,394 392,394 392,433 370,433"
    fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>

  <!-- Sähkötalo – center block, north of Korkeakoulunkatu -->
  <rect x="320" y="398" width="172" height="67"
        fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>

  <!-- Rakennustalo – center-right block, north of Korkeakoulunkatu -->
  <rect x="493" y="358" width="178" height="107"
        fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>

  <!-- Kampusareena – trapezoidal, south of Korkeakoulunkatu -->
  <polygon
    points="348,569 403,497 558,497 558,569"
    fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>

  <!-- Main building – south of Korkeakoulunkatu, right of Kampusareena -->
  <rect x="558" y="497" width="76" height="112"
        fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>

  <!-- Festia – below Kampusareena / Main building -->
  <rect x="478" y="583" width="84" height="110"
        fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>

  <!-- Tamppi Areena – right of Festia -->
  <rect x="592" y="553" width="138" height="140"
        fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>

  <!-- Konetalo – bottom center with courtyard (evenodd) -->
  <path fill-rule="evenodd"
    d="M 326,631 L 532,631 L 532,778 L 326,778 Z
       M 376,660 L 478,660 L 478,750 L 376,750 Z"
    fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>

  <!-- Parking garage building – left center -->
  <rect x="188" y="549" width="138" height="114"
        fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>

  <!-- Research facilities – right campus, 4 buildings -->
  <!-- Main long block -->
  <rect x="830" y="488" width="182" height="84"
        fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>
  <!-- Upper-east small block -->
  <rect x="1012" y="475" width="55" height="65"
        fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>
  <!-- Lower-east rect -->
  <rect x="958" y="598" width="48" height="54"
        fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>
  <!-- Angled small building -->
  <polygon points="993,620 1044,623 1041,677 990,673"
    fill="#2a241c" stroke="#8a7a5a" stroke-width="1.5" filter="url(#bs)"/>

  <!-- ================================================================
       TEXT LABELS
       ================================================================ -->

  <!-- Street names (IBM Plex Sans 10 px, #5a4c3a) -->
  <text x="578" y="216" class="sn">Tekniikankatu</text>
  <text x="148" y="511" class="sn">Korkeakoulunkatu</text>
  <text x="910" y="482" class="sn">Korkeakoulunkatu</text>
  <text x="460" y="793" class="sn">Hermiankatu</text>
  <text transform="translate(84,560) rotate(-90)" class="sn">Hervannan valtaväylä</text>
  <text transform="translate(1196,560) rotate(90)" class="sn">Hervannantie</text>

  <!-- Building names (Press Start 2P 7 px, #c8b890 @ 60%) -->
  <text x="622" y="186" class="bn" style="font-size:5px">Student sauna</text>

  <text x="229" y="432" class="bn">Tietotalo</text>

  <text x="441" y="338" class="bn">Noodi</text>

  <text x="406" y="434" class="bn">Sähkötalo</text>

  <text x="582" y="404" class="bn">
    <tspan x="582" dy="0">Rakennus-</tspan>
    <tspan x="582" dy="10">talo</tspan>
  </text>

  <text x="463" y="528" class="bn">
    <tspan x="463" dy="0">Kampus-</tspan>
    <tspan x="463" dy="10">areena</tspan>
  </text>

  <text x="596" y="546" class="bn">
    <tspan x="596" dy="0">Main</tspan>
    <tspan x="596" dy="10">building</tspan>
  </text>

  <text x="520" y="640" class="bn">Festia</text>

  <text x="661" y="620" class="bn">
    <tspan x="661" dy="0">Tamppi</tspan>
    <tspan x="661" dy="10">Areena</tspan>
  </text>

  <text x="429" y="705" class="bn">Konetalo</text>

  <text x="257" y="601" class="bn">
    <tspan x="257" dy="0">Parking</tspan>
    <tspan x="257" dy="10">garage</tspan>
  </text>

  <text x="921" y="525" class="bn">
    <tspan x="921" dy="0">Research</tspan>
    <tspan x="921" dy="10">facilities</tspan>
  </text>
</svg>
